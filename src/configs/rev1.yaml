# Stage 7 (revision 1) additions on top of full.yaml. Same out_dir (results/); new releases, attack sets and nulls only.
inherit: full.yaml
name: rev1

wm:
  exact_kgw_bin:  {method: exact_kgw_bin, gamma: 0.25, delta: 2.0, two_res: false, bin_min: 30}   # factorial: exact fine cell + 30-min bin
  exact_kgw_d1:   {method: exact_kgw, gamma: 0.25, delta: 1.0, two_res: false}                   # exact hash at lower strength (matched distortion)
  gm_kgw_eosn:    {method: kgw, gamma: 0.25, delta: 2.0, delta_mid: 1.0, k: 1, bin_min: 30, ctx: coarse, mask: M0, eos_neutral: true}
  a_g25_d4_eosn:  {method: kgw, gamma: 0.25, delta: 4.0, delta_mid: 2.0, k: 1, bin_min: 30, eos_neutral: true}
  gm_gumbel_m2:   {method: gumbel, k: 1, bin_min: 30, ctx: coarse, mask: M2}                     # seed-level masking (fresh seeds)
  posthoc_r10:    {method: posthoc, gamma: 0.25, delta: 2.0, k: 1, bin_min: 30, rate: 0.1}
  posthoc_r25:    {method: posthoc, gamma: 0.25, delta: 2.0, k: 1, bin_min: 30, rate: 0.25}
  posthoc_r50:    {method: posthoc, gamma: 0.25, delta: 2.0, k: 1, bin_min: 30, rate: 0.5}

releases:
  rev1_fact:     {gens: [gpt_porto_r9_s0], wm: [exact_kgw_bin, exact_kgw_d1], keys: [0, 1, 2], seeds: [0], n: 5000}
  rev1_eosn:     {gens: [gpt_porto_r9_s0, gpt_geolife_r9_s0], wm: [gm_kgw_eosn, a_g25_d4_eosn, gm_gumbel_m2], keys: [0, 1, 2], seeds: [0], n: 5000}
  rev1_posthoc:  {gens: [gpt_porto_r9_s0], wm: [posthoc_r10, posthoc_r25, posthoc_r50], keys: [0, 1, 2], seeds: [0], n: 5000}
  rev1_manykey:  {gens: [gpt_porto_r9_s0], wm: [exact_kgw, gm_kgw], keys: [300, 301, 302, 303, 304, 305, 306, 307, 308, 309, 310, 311, 312, 313, 314, 315, 316, 317, 318, 319, 320, 321, 322, 323, 324, 325, 326, 327, 328, 329, 330, 331, 332, 333, 334, 335, 336, 337, 338, 339, 340, 341, 342, 343, 344, 345, 346, 347, 348, 349], seeds: [0], n: 1000}
  rev1_gumkeymix: {gens: [gpt_porto_r9_s0], wm: [gm_gumbel_m2], keys: [100, 101, 102, 103, 104, 105, 106, 107, 108, 109, 110, 111, 112, 113, 114, 115, 116, 117, 118, 119, 120, 121, 122, 123, 124, 125, 126, 127, 128, 129, 130, 131, 132, 133, 134, 135, 136, 137, 138, 139, 140, 141, 142, 143, 144, 145, 146, 147, 148, 149], seeds: [0], n: 200}
  rev1_crypto:   {gens: [gpt_porto_r9_s0], wm: [gm_kgw], keys: [10000000, 10000001, 10000002], seeds: [0], n: 2000}
  rev1_llm:      {gens: [qwen15_porto_r9], wm: [gm_kgw_eosn], keys: [0, 1, 2], seeds: [0], n: 3300}
  rev1_radio_none: {gens: [gpt_porto_r9_s0], wm: [none], keys: [0], seeds: [20], n: 50000}

eval:
  attack_sets:
    rev1_fact: [none, noise30, noise100, down3, crop50, mm, mmrs, noise30+mm, retime15, retime60]
    rev1_eosn: [none, noise10, noise30, noise100, down2, down3, down5, retime15, retime60, crop25, crop50, splice30, mm, mmrs, noise30+mm]
    rev1_posthoc: [none, noise30, noise100, down3, crop50, mm, mmrs, noise30+mm]
    rev1_manykey: [none, noise30, down3, crop50, mm]
    rev1_crypto: [none, noise30, crop50]
    rev1_llm: [none, noise30, noise100, down3, crop50, mm, mmrs, noise30+mm, retime60]
  null_schemes_extra:
    porto_r9: [a_g50_d4, a_k0, gm_kgw_k2, a_k3, a_bin0, a_bin120, a_1r, a_ctxmid, a_gum_M0, a_gum_k2, a_gum_ctxmid, exact_kgw_bin, exact_kgw_d1, gm_gumbel_m2]
    geolife_r9: [a_g50_d4, gm_kgw_k2, a_gum_M0, gm_gumbel_m2]

# Stage 7: unwatermarked 50k-trace teacher corpus (seed 20, as the radio teachers) for post-hoc-recoloured radioactivity students
releases_extra_note: rev1_radio_none is generated by step gen-radio (src/rev1_steps.py)
